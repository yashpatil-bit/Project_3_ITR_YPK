# ============================================================================
# Wire-Trace Trial - single source of truth for robot + algorithm parameters.
# Everything marked  # MEASURE  must be checked on the real setup.
# ============================================================================

robot:
  base_link: base_link
  tip_link: rq_tool_tip               # Robotiq-85 tool tip (point between the fingertips) in the HEAL URDF
                                      # (flange = end-effector; the lab launch file builds both chains)
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]   # order expected by velocity controller
  joint_state_topic: /joint_states
  robot_description_topic: /robot_description
  velocity_command_topic: /velocity_controller/commands
  # Ring CENTRE relative to the tip_link frame (metres / radians).        # MEASURE
  # = from the point between the fingertips to the ring centre, usually only along z
  # (straight out of the gripper), e.g. ring centre 9 cm beyond the fingertips -> [0, 0, 0.09].
  # scripts/check_setup.py prints the rq_tool_tip axes to confirm which way z points.
  # Lab setup (find_pose result): probe handle held ACROSS the fingertips ("cross_y" grip),
  # ring centre 8 cm from the grip point along the tool-tip y axis. The rotation makes the
  # controlled frame's z axis = handle direction, so teleop n/m = roll about the handle.
  tool_xyz: [0.0, 0.08, 0.0]
  tool_rpy: [-1.5708, 0.0, 0.0]
  rate_hz: 100.0                      # control loop rate (starter code used 100 Hz)
  joint_state_timeout: 0.1            # s, stop if joint_states go stale
  # Hard cap on EVERY joint-velocity command any script sends [rad/s].
  # HEAL stopped with "Safety error : Large Velocity for Joint" during a 0.4 rad/s wrist roll.
  # Keep 0.25 until the TA tells us HEAL's safety threshold.
  # Both safety stops happened while the WRIST was turning (joint 6 at <= 0.12 rad/s), so the
  # wrist joints get a lower cap. Per joint [rad/s]: joint1..joint6
  qdot_hard_limit: [0.25, 0.25, 0.25, 0.10, 0.10, 0.06]

recording:
  rate_hz: 50.0                       # brief says >= 10-20 Hz, denser is better

contact:
  topic: /wire_contact                # std_msgs/Bool, published by scripts/contact_monitor.py

processing:
  min_step: 0.0003
  ds: 0.001
  smooth_sigma: 0.003                 # m - increase if teaching was shaky, but watch the deviation warning
  ori_smooth_sigma: 0.005
  max_smoothing_dev: 0.0015
  offset_xyz: [0.0, 0.0, 0.0]         # constant clearance shift (base frame), e.g. [0, 0, 0.002]
  v_max: 0.05                         # m/s - brief: start 5-10 cm/s, increase gradually
  a_max: 0.10
  a_lat_max: 0.10
  w_max: 0.10                         # rad/s probe roll speed (HEAL wrist safety: keep low)
  alpha_max: 0.5                      # rad/s^2 probe roll acceleration
  profile_smooth: 0.01
  curvature_sigma: 0.008
  dt: 0.01
  trim_start_end: 0.0
  raw_interp: linear                  # "spline" for sparse teleop waypoints

controller:
  kp_pos: 3.0
  kp_ori: 2.0
  damping: 0.02
  damping_max: 0.10
  sigma_thresh: 0.04
  qdot_max: [0.25, 0.25, 0.25, 0.10, 0.10, 0.06]   # rad/s, <= robot.qdot_hard_limit  # ask TA for HEAL's safety limit
  qddot_max: 1.0                      # rad/s^2 - gentle ramps (HEAL safety)
  qddot_stop: 3.0
  speed_scale: 0.1                    # ALWAYS start at 0.1 (10 %) - override with --speed
  err_soft: 0.0015
  err_abort: 0.006                    # abort if probe is > 6 mm off the desired path
  lag_soft: 0.010
  lag_abort: 0.030
  ori_err_abort: 0.20
  ori_err_soft: 0.05
  k_min: 0.2
  start_tol: 0.005
  done_tol: 0.0015
  settle_time: 1.5
  joint_margin: 0.05
  # Cartesian safety box for the probe tip in base_link.                  # MEASURE
  # Set it a few cm around the wire stand so a bug can never swing the arm far.
  workspace_min: [-1.0, -1.0, -0.05]
  workspace_max: [1.0, 1.0, 1.2]
